name: brokit CodeQL config

queries:
  - uses: security-extended

# The bundled engines (curl, FastNoise2, sqlite) and the siblings (bronze, brass,
# broimage, bromath) are kept out of the analysis by build order (see the pre-build
# step in codeql.yml) — that is what excludes their compiled TUs. This paths-ignore
# is the complement: it drops any finding that originates in a vendored/dependency
# *header* pulled into a brokit translation unit, which build order cannot
# catch. Together they scope the Security tab to brokit's own code. sqlite and
# miniz are vendored under third_party/; every other dependency is fetched under
# the build tree's _deps/.
paths-ignore:
  - brokit/third_party
  - build/_deps
