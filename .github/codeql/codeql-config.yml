name: brokit CodeQL config

queries:
  - uses: security-extended

# The bundled engines (curl, FastNoise2, sqlite), the siblings (bronze, brass,
# broimage, bromath) are kept out of the analysis by build order (see the pre-build
# step in codeql.yml) — that is what excludes their compiled TUs. This paths-ignore
# is the complement: it drops any finding that originates in a vendored/sibling
# *header* pulled into a brokit translation unit, which build order cannot
# catch. Together they scope the Security tab to brokit's own code.
paths-ignore:
  - brokit/third_party
  - bronze
  - brass
  - broimage
  - bromath
