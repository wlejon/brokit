version: 2

# The actions in .github/workflows/ carry pinned versions Dependabot can bump.
# The dependencies (curl, FastNoise2, broimage, bromath, bronze) are pinned to
# commits with bro_dependency() in CMakeLists.txt, and the SQLite amalgamation
# is a vendored source drop; neither has a manifest.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"
    ignore:
      # GitHub maintains the `v4` major tag and ships security fixes to it, so
      # `@v4` is already patched without any PR. Pinning to an exact patch would
      # trade that automatic patching for a codeql-action PR in every repo on
      # each release. Major bumps (v4 -> v5) still come through.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
