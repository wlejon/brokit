version: 2

# Two things carry pinned versions: the actions in .github/workflows/ and the
# git submodules (quickjs, curl, FastNoise2, broimage). The SQLite amalgamation
# is a vendored source drop with no manifest.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: "deps"
