name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# brokit builds curl and FastNoise2 from source, vendors a SQLite amalgamation,
# and delegates its bro.image kernels to the broimage sibling (which itself
# needs the header-only bromath). broimage's brotensor adapter is switched off
# (BROIMAGE_WITH_TENSOR=OFF) — brokit's image glue only uses the host-pointer
# kernels — so the heavy tensor stack is not pulled in.
#
# Every job builds a plain clone, checked out under brokit/ with the build tree
# beside it. curl, FastNoise2, broimage, bromath, and bronze (the JavaScript
# runtime brokit_api binds and the compiler that builds src/api/js/*.js, with
# brass, its code generator) come from the heads of their main branches (curl and FastNoise2 at pinned commits)
# (cmake/bro_deps.cmake), fetched at configure. There are no submodules and no
# sibling checkouts.
#
# bronze and brass compile inside this build tree with the job's own compiler
# and CRT — the api is bound across bronze's C++ embed boundary, so a prebuilt
# bronze would be an unverifiable ABI hazard. brass has native x86_64 and
# AArch64 code generators, so the JS tests run on every row, macos-arm64
# included.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022 }
          - { name: macos-arm64,  os: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brokit

      - name: MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S brokit -B build -DCMAKE_BUILD_TYPE=Release -DBROIMAGE_WITH_TENSOR=OFF
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Debug + --coverage on Linux. --filter scopes the numbers to brokit's own
  # code (src/); bronze / brass / curl / FastNoise2 / sqlite / broimage / bromath are
  # excluded.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brokit

      - name: Install gcovr
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr

      - name: Configure (instrumented)
        run: |
          cmake -S brokit -B build -DCMAKE_BUILD_TYPE=Debug -DBROIMAGE_WITH_TENSOR=OFF \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brokit/src/' \
            --exclude-unreachable-branches \
            --gcov-ignore-errors=no_working_dir_found \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/`'
            echo
            echo 'curl/FastNoise2/sqlite and the siblings are filtered out.'
            echo
            echo '```'
            if [ -f coverage-summary.txt ]; then
              cat coverage-summary.txt
            else
              echo 'No coverage summary available'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
