name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# brokit bundles curl and FastNoise2 as submodules and builds them from
# source, vendors a SQLite amalgamation, and delegates its bro.image kernels to
# the broimage sibling (which itself needs the header-only bromath). broimage's
# brotensor adapter is switched off (BROIMAGE_WITH_TENSOR=OFF) — brokit's image
# glue only uses the host-pointer kernels — so the heavy tensor stack is not
# pulled in.
#
#   $GITHUB_WORKSPACE/
#     brokit/     <- this repo; curl/FastNoise2 submodules initialised
#     bronze/     <- the JavaScript runtime brokit_api binds, and the
#                    compiler that builds src/api/js/*.js
#     brass/      <- bronze's code generator
#     broimage/   <- sibling, image kernels
#     bromath/    <- sibling, header-only
#
# bronze and brass are laid out by bronze's checkout-toolchain action and
# compiled inside this build tree (bronze add_subdirectory()s brass), with
# the job's own compiler and CRT — the api is bound across bronze's C++ embed
# boundary, so a prebuilt bronze would be an unverifiable ABI hazard. brass
# has native x86_64 and AArch64 code generators, so the JS tests run on every
# row, macos-arm64 included.
#
# The test and coverage jobs initialise only the curl and FastNoise2
# submodules: broimage and bromath come from the sibling checkouts on main,
# which brokit prefers over its third_party/ copies. The `submodule` job builds
# the other way, from a recursive clone with no siblings beside it, so the
# fallback a fresh `git clone --recursive` relies on cannot rot.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022 }
          - { name: macos-arm64,  os: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brokit

      - name: MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Initialise the curl and FastNoise2 submodules (broimage and bromath are siblings)
        shell: bash
        run: |
          git -C brokit submodule update --init --recursive \
            third_party/curl third_party/FastNoise2

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - uses: actions/checkout@v7
        with:
          repository: wlejon/broimage
          path: broimage

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bromath
          path: bromath

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S brokit -B build -DCMAKE_BUILD_TYPE=Release -DBROIMAGE_WITH_TENSOR=OFF
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

  # ── Submodule fallback ────────────────────────────────────────────────────
  #
  # No sibling checkouts: broimage and bromath come from the flat third_party/
  # submodules at the commits this repo pins, as they do for a fresh
  # `git clone --recursive`, and with brokit's own defaults (no
  # BROIMAGE_WITH_TENSOR on the command line). bronze and brass are the
  # documented exception (no submodule; the api has to compile against the
  # bronze of the program that loads it) and are laid out beside the repo as
  # in the other jobs. The configure step checks each sibling really took the
  # submodule path.
  submodule:
    name: Submodule fallback · ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brokit
          submodules: recursive

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Configure
        shell: bash
        run: |
          test ! -e broimage && test ! -e bromath
          cmake -S brokit -B build -DCMAKE_BUILD_TYPE=Release | tee configure.log
          for s in bromath broimage; do
            grep -q "brokit: $s from .*third_party/$s (submodule)" configure.log
          done

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Debug + --coverage on Linux. --filter scopes the numbers to brokit's own
  # code (src/); bronze / brass / curl / FastNoise2 / sqlite / broimage / bromath are
  # excluded.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brokit

      - name: Initialise the curl and FastNoise2 submodules (broimage and bromath are siblings)
        shell: bash
        run: |
          git -C brokit submodule update --init --recursive \
            third_party/curl third_party/FastNoise2

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - uses: actions/checkout@v7
        with:
          repository: wlejon/broimage
          path: broimage

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bromath
          path: bromath

      - name: Install gcovr
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr

      - name: Configure (instrumented)
        run: |
          cmake -S brokit -B build -DCMAKE_BUILD_TYPE=Debug -DBROIMAGE_WITH_TENSOR=OFF \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brokit/src/' \
            --exclude-unreachable-branches \
            --gcov-ignore-errors=no_working_dir_found \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/`'
            echo
            echo 'The bundled curl/FastNoise2/sqlite and siblings are filtered out.'
            echo
            echo '```'
            if [ -f coverage-summary.txt ]; then
              cat coverage-summary.txt
            else
              echo 'No coverage summary available'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
